name: Research portal
on:
  push:
    branches: [main]
    paths: ['README.md', 'CITATION.md', 'topics/**', 'site/**', 'articles/**/README.md', 'articles/**/metadata/**', 'books/**', '.github/workflows/research-portal.yml']
  pull_request:
    paths: ['README.md', 'CITATION.md', 'topics/**', 'site/**', 'articles/**/README.md', 'articles/**/metadata/**', 'books/**', '.github/workflows/research-portal.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-portal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: python -m pip install -r site/requirements.txt
      - run: python site/build.py
      - run: python site/check.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
